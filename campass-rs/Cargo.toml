[package]
name = "campass"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "campass"
path = "src/main.rs"

[dependencies]
# 纯 HTTP 客户端, 关掉 TLS(网关全是明文 http, 不需要 https)
minreq = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
