[package]
name = "campass"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "campass"
path = "src/main.rs"

[features]
default = []
# tls: URL 探测走真握手 + 证书校验(rustls 0.23 + aws-lc-rs)。
# aws-lc 在四个 mips 目标上都能交叉编译并正常工作(含大端, 已在 qemu-user 下
# 验证真握手 + 拒掉过期/自签证书; 交叉编译要点见 build.sh 的软浮点处理)。
# 仍做成可选, 只因体积: 开了从 ~860KB 涨到 ~2.3MB, 小 flash 机型吃不消。
# 不开时 URL 探测退回自带的 TLS 握手校验(只验对端会说 TLS, 不验证书)。
tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]

[dependencies]
# 纯 HTTP 客户端, 关掉 TLS(网关全是明文 http, 不需要 https)
minreq = { version = "2", default-features = false }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "aws-lc-rs", "tls12", "logging"] }
webpki-roots = { version = "1", optional = true }
rustls-pki-types = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
